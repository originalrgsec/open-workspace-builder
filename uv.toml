#
# 2026-04-19 (OWB-S141, Sprint 33): pin advanced from 2026-04-18 to
# 2026-04-19 after himitsubako v0.8.0 and v0.9.0 landed on PyPI
# earlier the same day via `pypi-release` env-gate approval.
# First-party package (originalrgsec), exempt from the 7-day
# quarantine per supply-chain-protection.md. Required so CI can
# resolve `himitsubako>=0.9.0`; local resolved cleanly because the
# uv cache had already seen the PyPI publish before CI's clean
# clone did.
# 2026-05-25 (security audit): pin advanced from 2026-04-19 to 2026-05-18
# to resolve three HIGH CVEs in transitive dependencies:
#   urllib3 2.6.3 → 2.7.0: CVE-2026-44431 (header leak on cross-origin
#     redirect), CVE-2026-44432 (decompression DoS). Published 2026-05-07,
#     quarantine cleared 2026-05-14.
#   python-multipart 0.0.22 → 0.0.27: CVE-2026-42561 + GHSA-mj87-hwqh-73pj
#     (multipart parsing DoS). GHSA-pp6c-gr5w-3c5g (header-count DoS).
#   starlette 1.0.0 → 1.0.1: PYSEC-2026-161 (host-header injection / auth
#     bypass).
# python-dotenv path-traversal fix (1.2.2) is blocked by litellm 1.83.10's
# exact pin on python-dotenv==1.0.1. Tracked as a future litellm bump item.
# 2026-10-21 (dependency CVE sweep): pin advanced from 2026-05-18 to
# 2026-10-14 (7 days before the sweep) to close open advisories in
# transitive and optional dependencies. Every fixed version below was
# published on or before 2026-10-13, so no quarantine override is used.
# Not closed by this sweep:
#   certifi GHSA-6q48-6c7w-9gw2 (compromised emSign intermediates): the
#     fix, 2026.10.19, is inside the quarantine window until 2026-10-26.
#   pyjwt CVE-2026-103001: no fixed release published.
# Explicit UTC timestamp: uv reads a bare date as the end of that day in
# local time, which can land inside the 7-day window.
exclude-newer = "2026-10-14T00:00:00Z"

# 2026-10-21 quarantine exception, certifi only (owner-approved): certifi
# <2026.10.19 trusts "emSign ECC Root CA - G3", whose eMudhra intermediate
# keys are publicly recoverable (GHSA-6q48-6c7w-9gw2; Go CVE-2026-111943).
# 2026.10.19 was published 2026-10-20 and would clear quarantine on
# 2026-10-27. Verified before the exception: the wheel diff against
# 2026.7.22 is the __version__ string plus removal of that single root
# from cacert.pem, with no other code or certificate changes. Remove this
# override once the global exclude-newer passes 2026-10-21.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

# constraint-dependencies live in pyproject.toml [tool.uv]: uv does not
