[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-workspace-builder"
version = "1.18.3"
description = "Scaffold, maintain, and secure AI coding workspaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "originalrgsec"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "himitsubako>=0.9.0",
]

[project.optional-dependencies]
# litellm bounds — supply-chain caution + advisory closure history:
#
#   2026-03-24: Snyk SNYK-PYTHON-LITELLM-15762713 — versions 1.82.7 + 1.82.8
#     compromised. Cap set to <=1.83.0 at that time.
#   2026-04-09: v1.83.0 reviewed clean (Sigstore OIDC, CI hardening, cosign
#     signing, pinned Codecov SHA, OpenSSF Scorecard). Closes
#     CVE-2026-35030 (critical), CVE-2026-35029 (high), pass-the-hash auth
#     bypass (high). 9-day quarantine.
#   2026-05-15 (v1.18.3 hotfix): four proxy-server CVEs in 1.81.8–1.83.9
#     range:
#       CVE-2026-42208 — proxy API-key SQLi (fix 1.83.7)  GHSA-r75f-5x8p-qvmc
#       CVE-2026-42271 — proxy MCP RCE       (fix 1.83.7)  GHSA-v4p8-mg3p-g94g
#       CVE-2026-42203 — proxy /prompts/test SSTI (fix 1.83.7) GHSA-xqmj-j6mv-4862
#       CVE-2026-40217 — proxy guardrails sandbox escape (fix 1.83.10)
#         GHSA-wxxx-gvqv-xp7p (published 2026-05-11, post-OWB#15-filing).
#     All four are litellm.proxy-only; OWB's library-client usage is not
#     directly exposed, but downstream consumers (Home-Ops) cannot ship the
#     audit-deps clean state until the cap is raised.
#   Bound rationale:
#     lower 1.83.10 — closes all four CVEs (CVE-2026-40217 only fixes here).
#     upper <1.84.0 — 1.84.0 published 2026-05-14, fails the OWB 7-day
#       supply-chain-protection quarantine policy. A future minor (after
#       2026-05-21) can lift this to <2.0.0 if 1.84.0 remains clean.
#   2026-05-25 (security audit): lock upgraded litellm 1.83.10 → 1.83.14
#     (published 2026-04-26, 29 days old). Unblocks python-dotenv 1.0.1 →
#     1.2.2 (path traversal fix). Also bumps pyjwt 2.11→2.12 (proxy-only),
#     aiohttp 3.13.3→3.13.4. Zero PyPI-listed advisories on 1.83.14.
#   2026-10-21 (dependency CVE sweep): 1.83.x carries CVE-2026-49468
#     (critical), CVE-2026-59822, CVE-2026-12773 (fixed 1.84.0) and
#     CVE-2026-84377 (fixed 1.88.6 and later lines). 1.84.0 has been public
#     for five months; cap lifted to <2.0.0 as anticipated above, floor
#     raised to 1.88.6.
llm = [
    "litellm>=1.88.6,<2.0.0",
]
security = [
    "pyyaml>=6.0",
    "litellm>=1.88.6,<2.0.0",
]
keyring = [
    "himitsubako[keychain]>=0.9.0",
]
secrets = [
    "himitsubako[keychain]>=0.9.0",
]
audit = [
    "pip-audit>=2.7.0",
]
# SBOM support (OWB-S107a): CycloneDX 1.6 schema + serializer. The library is
# Apache-2.0 (allowed) and was already transitive via pip-audit; S107a
# promotes it to a direct dependency so the relationship is explicit. Pinned
# to ≤10 to avoid the 11.x major bump, which will be evaluated separately
# during S107b or S107c.
sbom = [
    "cyclonedx-python-lib>=9.0,<11",
]
sast = [
    "semgrep>=1.50.0",
]
mcp = [
    # >=1.30.0 closes CVE-2026-52869/52870/59950/59951; <2 avoids an
    # unreviewed major-version API change.
    "mcp>=1.30.0,<2",
]
sheets = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]
xlsx = [
    "xlsxwriter>=3.0",
]
hooks = [
    "pre-commit>=3.0",
]
dev = [
    # pytest>=9.0.3 closes CVE-2025-71176 (tmpdir handling, medium).
    # Dependabot alert #17 surfaced on v1.14.0 push; dev-dep only,
    # never ships in the wheel. (OWB-SEC-004)
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
    "build",
    "pip-audit>=2.7.0",
    "semgrep>=1.50.0",
    "pre-commit>=3.0",
    # pyright pin matches himitsubako DRN-077 for org-wide tooling
    # consistency (OWB-S139, DRN-078). Budget = 96 frozen errors;
    # enforced via scripts/pyright-gate.py.
    "pyright>=1.1,<2.0",
]

[project.urls]
Homepage = "https://github.com/originalrgsec/open-workspace-builder"
Repository = "https://github.com/originalrgsec/open-workspace-builder"
Issues = "https://github.com/originalrgsec/open-workspace-builder/issues"

[project.scripts]
owb = "open_workspace_builder.cli:owb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_workspace_builder = ["py.typed", "security/data/*.yaml", "data/registry/**/*.yaml", "data/*.toml", "evaluator/data/*.yaml", "evaluator/data/**/*.yaml", "content/**/*.md", "vendor/**/*.md", "vendor/**/*.yaml", "vendor/**/*.py", "sbom/_data/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain constraints on transitive dependencies (2026-10-21 sweep). Floors are the first
# release that closes the advisories noted; they prevent a future re-lock
# from regressing.
constraint-dependencies = [
    "aiohttp>=3.14.4",            # CVE-2026-111064/111066/69244, GHSA-2g87-pp6c-29x5
    "anyio>=4.14.2",              # CVE-2026-63374, CVE-2026-64847
    "cryptography>=50.0.0",       # CVE-2026-69247/69248/69249, GHSA-537c-gmf6-5ccf
    "fsspec>=2026.6.0",           # CVE-2026-104851
    "httplib2>=0.32.0",           # CVE-2026-59939
    "idna>=3.15",                 # CVE-2026-45409
    "msgpack>=1.2.1",             # GHSA-6v7p-g79w-8964
    "multidict>=6.9.1",           # CVE-2026-104874
    "oauthlib>=4.0.0",            # CVE-2026-49264, CVE-2026-49265
    "pip>=26.2",                  # CVE-2026-13346/3219/6357/8643
    "pyasn1>=0.6.4",              # CVE-2026-59884/59885/59886
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "pygments>=2.20.0",           # CVE-2026-4539
    "pyjwt>=2.15.0",              # CVE-2026-48522..48526, CVE-2026-101917/101918, 102267..102275
    "python-multipart>=0.0.31",   # CVE-2026-53537..53540
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",           # CVE-2026-48710/48817/48818, CVE-2026-54282/54283
    "urllib3>=2.8.0",             # CVE-2026-97687/97688/97689
    "virtualenv>=21.14.7",        # CVE-2026-102925/102930/102937/102938, GHSA-vxj4-q4g9-crj7
]
